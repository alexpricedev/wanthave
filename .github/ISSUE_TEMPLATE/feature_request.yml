name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution — what's awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: markdown
    attributes:
      value: |
        This project deliberately stays narrow: it builds and shares trade
        lists. Trade matching, messaging, offers and collection tracking are out
        of scope. See [PRD.md](../PRD.md) for the product boundaries.
